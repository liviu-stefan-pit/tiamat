[workspace]
resolver = "2"
members = ["crates/tiamat-contracts", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Tiamat"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.29"
