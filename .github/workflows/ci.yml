name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # Workspace Cargo.toml lives at repo root; artifacts go to ./target.
          workspaces: ". -> target"

      - name: Linux WebKit + display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Ubuntu 24.04: Ayatana only (libappindicator3-dev conflicts).
          # xvfb is required so the Tauri desktop launch smoke can open a GTK window.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            xdg-utils \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        # Tauri embeds ../dist at compile time; build before cargo test/clippy.
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            npx playwright install chromium --with-deps
          else
            npx playwright install chromium
          fi
        shell: bash

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (workspace)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a cargo test --workspace
          else
            cargo test --workspace
          fi

      - name: TypeScript check
        run: npm run lint:frontend

      - name: Frontend unit tests
        run: npm run test:frontend

      - name: Documentation validation
        run: npm run test:docs

      - name: E2E smoke (dev host)
        run: npm run test:e2e
