name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux WebKit dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # Ubuntu 24.04: use Ayatana only — libappindicator3-dev conflicts with it.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tiamat ${{ github.ref_name }}
          releaseBody: |
            Cross-platform release for ${{ github.ref_name }}.

            Verify SHA-256 sums in the release assets / PACKAGE-HASHES when published.
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.conf.json
